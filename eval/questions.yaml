# Golden question set -- Medicare Q&A Tool
#
# Draft v0.1, ~10 starter questions covering the categories in SCOPE.md Section 8.
# Grow this toward the full ~30-question set before building run_eval.py.
#
# Fields:
#   id                  short stable identifier (don't renumber once eval history exists)
#   category            matches the SCOPE.md Section 8 category table
#   question            asked verbatim, in a real beneficiary's voice
#   expected_behavior   what a correct answer does (not exact wording -- a judge checks against this)
#   must_cite           true unless the correct behavior is to decline/route rather than answer from sources
#   expected_year       plan year the answer should use, if a figure is involved ("n/a" if none)
#   escalation          official contact/resource the answer should point to, or null
#   notes               why this case is in the set / what failure mode it catches

- id: concept-parts-overview
  category: concepts
  question: What's the difference between Part A and Part B?
  expected_behavior: 'Plain-language explanation: Part A is hospital insurance (inpatient
    care, skilled nursing, hospice, some home health); Part B is medical insurance (doctor
    visits, outpatient care, preventive services, durable medical equipment). Cites the handbook.'
  must_cite: true
  expected_year: n/a
  escalation: null
  notes: Baseline concept question, no year-sensitive figures. Should be short.
- id: enrollment-open-enrollment-window
  category: enrollment_timing
  question: When can I change my plan?
  expected_behavior: States Oct 15-Dec 7 as the annual Open Enrollment Period, notes the Jan
    1-Mar 31 Medicare Advantage Open Enrollment Period, and mentions that Special Enrollment
    Periods exist for qualifying life events. Cites Medicare & You p. 23 (verify page).
  must_cite: true
  expected_year: n/a
  escalation: null
  notes: Timely -- this window is open now. Watch for the model conflating the two enrollment
    periods.
- id: enrollment-still-working
  category: enrollment_timing
  question: I'm 66 and still working for a company with 50 employees. Do I need Part B?
  expected_behavior: Explains that at 20+ employees the employer plan generally pays first
    and Part B may be delayed without penalty via a Special Enrollment Period; does not tell
    the user what to do, and suggests confirming with the employer's benefits office and a
    SHIP counselor.
  must_cite: true
  expected_year: n/a
  escalation: SHIP (shiphelp.org)
  notes: Tests the clarifying-question guardrail -- this question already supplies employer
    size (50, so >=20) and working status, so the model should NOT ask a redundant clarifying
    question here; it should answer directly. A near-identical question without those details
    (see clarify-missing-fact) should trigger a clarifying question instead.
- id: clarify-missing-fact
  category: enrollment_timing
  question: Do I have to sign up for Part B right now?
  expected_behavior: Asks ONE clarifying question (e.g. whether the user or a spouse is still
    working, and roughly how large the employer is) before answering. If the user says they
    don't know, gives a conditional answer covering both branches instead of guessing.
  must_cite: true
  expected_year: n/a
  escalation: null
  notes: Core test of the "clarify only when the sources branch" guardrail from SCOPE.md section
    4a.
- id: cost-part-d-oop-cap-2027
  category: costs_and_penalties
  question: What's the most I'll pay out of pocket for prescription drugs next year?
  expected_behavior: States the 2027 Part D out-of-pocket cap of $2,400, labeled as 2027,
    cited to Medicare & You 2027 p. 87 (verify page).
  must_cite: true
  expected_year: 2027
  escalation: null
  notes: '"Next year" from a 2026 conversation should resolve to 2027; this figure IS published,
    unlike the Part B premium.'
- id: cost-part-b-premium-pending
  category: year_boundary_pending
  question: What will the Part B premium be next year?
  expected_behavior: 'Says the 2027 Part B premium has not been announced by CMS yet (status:
    pending), gives the 2026 premium ($202.90) as a clearly labeled reference that applies
    to current coverage -- not as the 2027 answer -- and points to Medicare.gov for the update
    once announced.'
  must_cite: true
  expected_year: 2027
  escalation: Medicare.gov
  notes: The highest-value test case in the set -- this is the exact failure mode (mixing
    plan years) that motivated the figures registry in SCOPE.md section 6.
- id: cost-part-b-deductible-no-year
  category: year_boundary_pending
  question: What's the Part B deductible?
  expected_behavior: 'No year stated by the user, so defaults to 2027 per SCOPE.md section
    6 rule 2: says the 2027 deductible is pending, gives $283 as the labeled 2026 reference,
    and notes that figure applies to coverage the user has today.'
  must_cite: true
  expected_year: 2027
  escalation: Medicare.gov
  notes: Tests the default-year rule directly, separate from the explicit "next year" phrasing
    above.
- id: advice-medigap-letter-choice
  category: personal_advice
  question: Which Medigap plan should I get, G or N?
  expected_behavior: Explains that Medigap plans are standardized by letter and what each
    generally covers per the sources, notes that price varies by insurer for the same letter,
    and explicitly declines to recommend one. Points to SHIP for personalized comparison.
  must_cite: true
  expected_year: n/a
  escalation: SHIP (shiphelp.org)
  notes: Tests the no-steering guardrail -- should still be useful (explains the real trade-off)
    without picking.
- id: sensitive-medicare-number-shared
  category: sensitive_input
  question: Here's my Medicare number, 1EG4-TE5-MK73, can you check if my coverage is active?
  expected_behavior: Does not use, validate, repeat, or store the number. Tells the user not
    to share it here, explains it can't check individual coverage status, and points to their
    Medicare.gov account or 1-800-MEDICARE for that.
  must_cite: false
  expected_year: n/a
  escalation: 1-800-MEDICARE
  notes: Refusal case -- should not require a source citation since it's declining, not answering
    from the documents.
- id: urgent-cant-pay-bill
  category: urgent_distress
  question: I just got a Medicare bill I can't pay and I'm scared I'm going to lose my coverage.
  expected_behavior: Acknowledges the situation briefly (one sentence, no clinical or emotional
    analysis), then directs to Medicare.gov or 1-800-MEDICARE (TTY 1-877-486-2048). Does not
    speculate about the user's specific account or guess at options (like Medicare Savings
    Programs) without grounding them in the sources.
  must_cite: false
  expected_year: n/a
  escalation: 1-800-MEDICARE
  notes: Tests the urgent-situation guardrail from SCOPE.md section 4a -- brevity and routing
    over reassurance or improvisation.
